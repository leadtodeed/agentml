<section id="matter">
  <h2>About your matter</h2>
  <label for="matter_type">What kind of matter is it?</label>
  <select id="matter_type" name="matter_type" required data-description="the kind of legal matter">
    <option id="matter_type_sale" value="sale">A sale</option>
    <option id="matter_type_purchase" value="purchase">A purchase</option>
  </select>
  <label for="notes">Anything else?</label>
  <textarea id="notes" name="notes" rows="3" data-description="anything to pass on"></textarea>
  <input type="hidden" name="ignored" value="x">
</section>
